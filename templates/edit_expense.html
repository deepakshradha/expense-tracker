{% extends "base.html" %}

{% block title %}Edit Expense - Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/edit_expense.css') }}">
{% endblock %}

{% block content %}
<div class="edit-container">
    <h1>Edit Expense</h1>
    <p class="subtitle">Update the details of your transaction.</p>

    <div class="form-card">
        <form action="{{ url_for('edit_expense', id=expense['id']) }}" method="POST" class="expense-form">
            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" name="amount" step="0.01" placeholder="0.00"
                       value="{{ expense['amount'] }}" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled>Select a category</option>
                    {% for cat in ['Food', 'Transport', 'Bills', 'Health', 'Entertainment', 'Shopping', 'Other'] %}
                    <option value="{{ cat }}" {% if expense['category'] == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required value="{{ expense['date'] }}">
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <input type="text" id="description" name="description" placeholder="What was this for?"
                       value="{{ expense['description'] or '' }}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary">Update Expense</button>
                <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
